{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — WBuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-6 col-lg-4">

            <div class="text-center mb-3">
                <a href="{% url 'index' %}" class="text-decoration-none">
                    <i class="bi bi-bag-heart-fill text-primary fs-3 me-1"></i>
                    <strong class="text-primary fs-5">WBuy</strong>
                </a>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-1">Create Account</h5>
                    <p class="text-muted small mb-3">Join WBuy and start shopping today.</p>

                    {% if error %}
                    <div class="alert alert-danger py-2 small">{{ error }}</div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Username</label>
                            <input type="text" class="form-control" name="username" placeholder="Choose a username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Email</label>
                            <input type="email" class="form-control" name="email" placeholder="you@example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Password</label>
                            <input type="password" class="form-control" name="password1" placeholder="Minimum 8 characters" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Confirm Password</label>
                            <input type="password" class="form-control" name="password2" placeholder="Re-enter password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Create Account</button>
                    </form>

                    <hr class="my-3">
                    <p class="text-center small mb-0">
                        Already have an account? <a href="{% url 'login' %}">Sign in here</a>
                    </p>
                </div>
            </div>

            <p class="text-center small mt-3">
                <a href="{% url 'index' %}" class="text-muted"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
